<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận tiếp nhận mẫu - RRT HCDC</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Lexend', system-ui, sans-serif; background: #006a75; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #1f2937; }

    .card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.15); max-width: 520px; width: 100%; overflow: hidden; animation: slideUp .4s ease; text-align: center; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: translateY(0) } }

    .header { background: #fd7e14; padding: 24px; color: #fff; }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin: 0; }

    .body { padding: 32px; }

    .footer { background: #f9fafb; padding: 16px 24px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; line-height: 1.5; }
    .btn { display: inline-block; padding: 12px 24px; background: #fd7e14; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; transition: background .2s; border: none; cursor: pointer; width: 100%; text-align: center; }
    .btn:hover { background: #ea580c; }
    .btn:disabled { background: #d1d5db; cursor: not-allowed; }

    /* Form Styles */
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-label { font-weight: 600; font-size: 14px; margin-bottom: 8px; display: block; color: #374151; }
    .form-box { background: #f3f4f6; padding: 14px; border-radius: 8px; display: flex; align-items: center; }
    .form-box-multi { background: #f3f4f6; padding: 14px; border-radius: 8px; max-height: 180px; overflow-y: auto; }
    .chk-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: 500; }
    .chk-item:last-child { margin-bottom: 0; }
    .chk-item input { width: 18px; height: 18px; margin-right: 12px; accent-color: #fd7e14; cursor: pointer; }
    .num-input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; outline: none; transition: border .2s; font-family: inherit; font-weight: 600; color: #1f2937; }
    .num-input:focus { border-color: #fd7e14; }
    .num-input.invalid { border-color: #ef4444; }
    .err-hint { font-size: 13px; color: #dc2626; margin-top: 6px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><h1>HỆ THỐNG HCDC - RRT</h1></div>

    <div class="body" id="dynamic-content">
      <div style="text-align: center;">
        <div style="font-size:64px; margin-bottom:16px;">⏳</div>
        <div style="display:inline-block; padding:6px 16px; border-radius:20px; font-size:14px; font-weight:600; margin-bottom:16px; background:#e5e7eb; color:#374151;">ĐANG XỬ LÝ...</div>
        <div style="background:#f3f4f6; padding:16px; border-radius:8px; font-size:15px; color:#374151; line-height:1.6; margin-bottom:24px; text-align: left; border-left: 4px solid #9ca3af;">Đang đồng bộ dữ liệu với máy chủ, vui lòng đợi trong giây lát...</div>
      </div>
    </div>
    <div class="footer">
      <p><strong>Trung tâm Kiểm soát Bệnh tật Thành phố Hồ Chí Minh</strong></p>
      <p>Địa chỉ: 366A Âu Dương Lân, Phường Chánh Hưng, Thành phố Hồ Chí Minh, Việt Nam</p>
      <p>Điện thoại: 0909 408 895</p>
    </div>
  </div>
  <script>
    const EDGE_FUNC_URL = "https://sxzjbygiowpscyhiffqc.supabase.co/functions/v1/handle-lab-callback";
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const dynamicContent = document.getElementById('dynamic-content');
    let _reqQty = 0; // FIX 2: lưu số yêu cầu để kiểm client

    function renderState(type, msgText, extraHtml = '') {
      let icon, badge, badgeBg, badgeColor, msgBorder;
      if (type === 'loading') {
        icon = "⏳"; badge = "ĐANG TẢI..."; badgeBg = "#e5e7eb"; badgeColor = "#374151"; msgBorder = "#9ca3af";
      } else if (type === 'error') {
        icon = "❌"; badge = "LỖI HỆ THỐNG"; badgeBg = "#fee2e2"; badgeColor = "#dc2626"; msgBorder = "#ef4444";
      } else if (type === 'warning') {
        icon = "⚠️"; badge = "ĐÃ XỬ LÝ"; badgeBg = "#fef3c7"; badgeColor = "#d97706"; msgBorder = "#f59e0b";
      } else if (type === 'success') {
        icon = "✅"; badge = "THÀNH CÔNG"; badgeBg = "#dcfce7"; badgeColor = "#16a34a"; msgBorder = "#10b981";
      }
      dynamicContent.innerHTML = `
        <div style="text-align: center; animation: slideUp .3s ease;">
          <div style="font-size:64px; margin-bottom:16px;">${icon}</div>
          <div style="display:inline-block; padding:6px 16px; border-radius:20px; font-size:14px; font-weight:600; margin-bottom:16px; background:${badgeBg}; color:${badgeColor};">${badge}</div>
          <div style="background:#f3f4f6; padding:16px; border-radius:8px; font-size:15px; color:#374151; line-height:1.6; margin-bottom:24px; text-align: left; border-left: 4px solid ${msgBorder};">${msgText}</div>
          ${extraHtml}
        </div>
      `;
    }

    function renderForm(data) {
      // KIỂM TRA NULL/UNDEFINED VÀ ÉP KIỂU MẢNG CHO CẢ KỸ THUẬT VÀ TÁC NHÂN
      const pathogens = Array.isArray(data.pathogens) ? data.pathogens : [];
      const testTypes = Array.isArray(data.test_types) ? data.test_types : [];
      _reqQty = parseInt(data.requested_qty, 10) || 0; 

      // 1. Dựng HTML cho danh sách Tác nhân
      let pathogensHtml = '';
      if (pathogens.length === 0) {
        pathogensHtml = '<div style="font-size:14px; color:#6b7280; font-style: italic;">Không chỉ định cụ thể tác nhân.</div>';
      } else {
        pathogensHtml = pathogens.map(p => `
          <div class="chk-item">
            <input type="checkbox" class="chk-pathogen" value="${p}" checked>
            <span>${p}</span>
          </div>
        `).join('');
      }

      // 2. Dựng HTML cho danh sách Kỹ thuật (Mới)
      let techsHtml = '';
      if (testTypes.length === 0) {
        techsHtml = '<div style="font-size:14px; color:#6b7280; font-style: italic;">Không có thông tin kỹ thuật.</div>';
      } else {
        techsHtml = testTypes.map(t => `
          <div class="chk-item">
            <input type="checkbox" class="chk-tech" value="${t}" checked style="width:18px; height:18px; margin-right:12px; accent-color:#fd7e14; cursor:pointer;">
            <span style="font-size:14px; font-weight:600;">${t}</span>
          </div>
        `).join('');
      }

      // 3. Render giao diện tổng
      dynamicContent.innerHTML = `
        <div style="text-align: left; animation: slideUp .4s ease;">
          <h2 style="color: #006a75; font-size: 18px; margin-bottom: 8px; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px;">XÁC NHẬN TIẾP NHẬN MỘT PHẦN THEO YÊU CẦU ĐIỀU PHỐI MẪU</h2>
          <p style="font-size: 13px; color: #6b7280; margin-bottom: 20px; line-height: 1.5;">Vui lòng điều chỉnh thông tin bên dưới phù hợp với năng lực thực tế của đơn vị hiện tại.</p>

          <div class="form-group">
            <label class="form-label">Kỹ thuật xét nghiệm:</label>
            <div class="form-box-multi">
              ${techsHtml}
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Tác nhân gây bệnh mà đơn vị có thể thực hiện (Còn sinh phẩm):</label>
            <div class="form-box-multi">
              ${pathogensHtml}
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 28px;">
            <label class="form-label">Số lượng mẫu có thể tiếp nhận tối đa:</label>
            <input type="number" id="qty-input" class="num-input" min="1" max="${_reqQty}" value="${_reqQty}">
            <div class="err-hint" id="qty-err" style="color: #dc2626; font-size: 13px; margin-top: 6px; display: none;"></div>
            <div style="font-size: 13px; color: #6b7280; margin-top: 8px;">
              Số mẫu HCDC đang yêu cầu: <b style="color:#fd7e14;">${_reqQty}</b> mẫu.
            </div>
          </div>

          <button class="btn" id="submit-btn" onclick="submitForm()">🚀 XÁC NHẬN GỬI KẾT QUẢ</button>
        </div>
      `;
    }

    if (!token) {
      renderState('error', "Không tìm thấy mã bảo mật (token) trong đường dẫn truy cập.");
    } else {
      fetch(`${EDGE_FUNC_URL}?token=${token}&action=get_info`)
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            renderState('error', "Liên kết xác nhận đã hết hạn hoặc mã không tồn tại trên hệ thống.");
            return;
          }
          if (data.status !== 'inquiry_sent') {
            renderState('warning', "Yêu cầu này đã được đơn vị xử lý trước đó. Bạn không cần thao tác lại, xin cảm ơn!", '<a href="https://hcdc-ap.github.io/RRT/" class="btn">🏠 Về Trang chủ</a>');
            return;
          }
          renderForm(data);
        })
        .catch(err => {
          renderState('error', "Không thể kết nối đến máy chủ: " + err.message);
        });
    }

    window.submitForm = function() {
      const qtyInput = document.getElementById('qty-input');
      const errEl = document.getElementById('qty-err');
      const btn = document.getElementById('submit-btn');
      if (!qtyInput) return;

      const qty = parseInt(qtyInput.value, 10);

      // Kiểm số lượng phía client (thân thiện)
      if (!Number.isFinite(qty) || qty <= 0 || qty > _reqQty) {
        qtyInput.style.borderColor = '#dc2626';
        if (errEl) {
          errEl.textContent = `Vui lòng nhập số từ 1 đến ${_reqQty} mẫu.`;
          errEl.style.display = 'block';
        }
        return;
      }
      qtyInput.style.borderColor = '#d1d5db';
      if (errEl) errEl.style.display = 'none';

      // THU THẬP KẾT QUẢ TỪ CÁC CHECKBOX DƯỚI DẠNG MẢNG
      const selectedTechs = Array.from(document.querySelectorAll('.chk-tech:checked')).map(cb => cb.value);
      const selectedPathogens = Array.from(document.querySelectorAll('.chk-pathogen:checked')).map(cb => cb.value);

      if (btn) btn.disabled = true;
      renderState('loading', "Đang gửi xác nhận của bạn tới hệ thống trung tâm HCDC...");

      fetch(EDGE_FUNC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: token,
          accepted_qty: qty,
          accepted_test_types: selectedTechs, 
          accepted_pathogens: selectedPathogens
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success === true) {
          renderState('success', "Cảm ơn đơn vị. HCDC đã ghi nhận thông tin phản hồi và sẽ tiến hành phê duyệt điều phối mẫu trên hệ thống.", '<a href="https://hcdc-ap.github.io/RRT/" class="btn">🏠 Đóng cửa sổ</a>');
        } else {
          renderState('error', (data.message || "Có lỗi xảy ra trong quá trình ghi nhận.") + " Vui lòng thử lại sau.");
        }
      })
      .catch(err => {
        renderState('error', "Lỗi kết nối khi gửi dữ liệu: " + err.message);
      });
    }
  </script>
</body>
</html>
